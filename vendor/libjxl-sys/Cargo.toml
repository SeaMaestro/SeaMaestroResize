[package]
name = "libjxl-sys"
version = "0.1.0"
edition = "2021"
description = "Low-level FFI bindings to libjxl (JPEG XL codec)"
license = "MIT OR Apache-2.0"
links = "jxl"
build = "build.rs"

[features]
use-bindgen = ["dep:bindgen"]

[dependencies]
libc = "0.2"

[build-dependencies]
vcpkg = "0.2"
bindgen = { version = "0.72", optional = true }
