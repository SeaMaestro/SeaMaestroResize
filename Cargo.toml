[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "SeaMonkeyResize"
version = "2.3.0"
edition = "2021"

[dependencies]
crc32fast = "1"
clap = { version = "4.6", features = ["derive"] }
image = "0.25"
rayon = "1.12"
mozjpeg = "0.10"
webp = "0.3"
ravif = "0.13"
oxipng = "10.2"
libheif-rs = { version = "2.7", features = ["image"] }
rawler = "=0.7.2"
exif = { package = "kamadak-exif", version = "0.6" }
rgb = { version = "0.8", features = ["bytemuck"] }
ico = "0.5"
qoi = "0.4"
anyhow = "1.0"
fastrand = "2.5"
fast_image_resize = { version = "6.1", features = ["image", "rayon"] }
regex = "1.13"
unicode-width = "0.2"
indicatif = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"
jwalk = "0.8"
jxl-oxide = { version = "0.12.5", features = ["image"] }
jxl-encoder = "0.3.1"
tiff = "0.11"
miniz_oxide = "0.8"
resvg = "0.48.1"
fontdb = { version = "0.24.0", features = ["fs"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[patch.crates-io]
jxl-oxide = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3e0947b8cbdd2b1022a8f951682d36ca02" }