name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\vcpkg_installed
  VCPKGRS_TRIPLET: x64-windows-static
  PKG_CONFIG: pkgconf
  PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg_installed\x64-windows-static\lib\pkgconfig
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static --x-install-root="${{ github.workspace }}\vcpkg_installed"

      - name: Add pkgconf to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\vcpkg_installed\x64-windows-static\tools\pkgconf"

      - name: Check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release
