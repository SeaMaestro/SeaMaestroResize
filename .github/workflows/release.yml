name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKGRS_TRIPLET: x64-windows-static
  PKG_CONFIG: pkgconf
  PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows-static\lib\pkgconfig
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Reset VCPKG_ROOT after MSVC
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute vcpkg deps hash
        id: vcpkg-deps
        shell: pwsh
        run: |
          $deps = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).dependencies | ConvertTo-Json -Compress -Depth 10
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($deps)
          $hash = ([System.BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLower()
          "deps_hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-${{ steps.vcpkg-deps.outputs.deps_hash }}
          cache-all-crates: "true"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-v4-${{ runner.os }}-x64-windows-static-${{ steps.vcpkg-deps.outputs.deps_hash }}

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static --x-install-root="C:\vcpkg\installed"

      - name: Ensure vcpkg status updates dir
        shell: pwsh
        run: |
          $dir = "C:\vcpkg\installed\vcpkg\updates"
          [System.IO.Directory]::CreateDirectory($dir) | Out-Null
          if (-not (Test-Path -LiteralPath $dir -PathType Container)) {
            throw "Failed to create vcpkg updates dir: $dir"
          }

      - name: Add pkgconf to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\vcpkg\installed\x64-windows-static\tools\pkgconf"

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SeaMaestroResize_${{ github.ref_name }}
          path: target/release/SeaMaestroResize.exe
          archive: false
          if-no-files-found: error

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "target/release/SeaMaestroResize.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SeaMaestroResize.exe" | Out-File -FilePath checksums.txt -Encoding ascii

      - name: Extract current release notes
        shell: pwsh
        run: |
          $content = Get-Content release_notes.md -Raw -Encoding utf8
          $top = ($content -split '(?m)^---[ \t]*\r?$')[0].Trim()
          $top | Out-File -FilePath release_notes_current.md -Encoding utf8

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "SeaMaestroResize ${{ github.ref_name }}" --notes-file release_notes_current.md "target/release/SeaMaestroResize.exe#SeaMaestroResize_${{ github.ref_name }}.exe" "checksums.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
