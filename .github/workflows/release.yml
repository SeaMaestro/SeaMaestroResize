name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\vcpkg_installed
  VCPKGRS_TRIPLET: x64-windows-static
  PKG_CONFIG: pkgconf
  PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg_installed\x64-windows-static\lib\pkgconfig
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static --x-install-root="${{ github.workspace }}\vcpkg_installed"

      - name: Add pkgconf to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\vcpkg_installed\x64-windows-static\tools\pkgconf"

      - name: Build
        run: cargo build --release

      - name: Stage asset
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Copy-Item "target\release\SeaMaestroResize.exe" "SeaMaestroResize_$ver.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaMaestroResize_${{ github.ref_name }}
          path: SeaMaestroResize_*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: SeaMaestroResize ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: SeaMaestroResize_*.exe
