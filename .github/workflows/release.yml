name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKGRS_TRIPLET: x64-windows-static
  PKG_CONFIG: pkgconf
  PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows-static\lib\pkgconfig
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-${{ runner.os }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-x64-windows-static-

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static --x-install-root="C:\vcpkg\installed"

      - name: Ensure vcpkg status updates dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "C:\vcpkg\installed\vcpkg\updates" | Out-Null

      - name: Add pkgconf to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\vcpkg\installed\x64-windows-static\tools\pkgconf"

      - name: Build
        run: cargo build --release

      - name: Stage asset
        shell: pwsh
        run: Copy-Item "target\release\SeaMaestroResize.exe" "SeaMaestroResize.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaMaestroResize_${{ github.ref_name }}
          path: SeaMaestroResize.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: SeaMaestroResize ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: SeaMaestroResize.exe
