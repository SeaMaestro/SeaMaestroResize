name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKGRS_TRIPLET: x64-windows-static
  PKG_CONFIG: pkgconf
  PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows-static\lib\pkgconfig
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-${{ runner.os }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-x64-windows-static-

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static --x-install-root="C:\vcpkg\installed"

      - name: Ensure vcpkg status updates dir
        shell: pwsh
        run: |
          $dir = "C:\vcpkg\installed\vcpkg\updates"
          [System.IO.Directory]::CreateDirectory($dir) | Out-Null
          if (-not (Test-Path -LiteralPath $dir -PathType Container)) {
            throw "Failed to create vcpkg updates dir: $dir"
          }

      - name: Add pkgconf to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\vcpkg\installed\x64-windows-static\tools\pkgconf"

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SeaMaestroResize_${{ github.ref_name }}
          path: target/release/SeaMaestroResize.exe
          archive: false
          if-no-files-found: error

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "target/release/SeaMaestroResize.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SeaMaestroResize.exe" | Out-File -FilePath checksums.txt -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/SeaMaestroResize.exe#SeaMaestroResize_${{ github.ref_name }}.exe
            checksums.txt
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
