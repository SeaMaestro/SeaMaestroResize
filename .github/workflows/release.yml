name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static

      - name: Build
        run: cargo build --release

      - name: Stage asset
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Copy-Item "target\release\SeaMaestroResize.exe" "SeaMaestroResize_$ver.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaMaestroResize_${{ github.ref_name }}
          path: SeaMaestroResize_*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: SeaMaestroResize ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: SeaMaestroResize_*.exe